name: "CI"

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

jobs:
  backend_checks:
    name: Backend Mandatory Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./
    steps:
      - uses: actions/checkout@v4
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run Ruff Check
        run: ruff check --output-format=github .
      - name: Run Ruff Format
        run: ruff format --check .
      - name: Run Mypy Check
        run: mypy $(find . -type f \( -name "*.py" -o -name "*.pyi" \))
      - name: Run Tests
        run: python -m pytest
